# Sentinel facts — the single source of truth referenced by CONTEXT.md.
#
# Generated corpora are nondeterministic, so a small set of facts is planted verbatim
# in each client's corpus. Retrieval, citation, and eval tests assert against these,
# which gives them stable ground truth.
#
# Rules:
#   1. The sentence must appear in the named document character-for-character.
#   2. A sentinel must never appear in another client's corpus — the cross-client
#      isolation tests depend on it.
#   3. Mock tool data must agree with the corpus. A tool that contradicts a cited
#      clause is the worst possible demo failure.

acme-fab:
  AF-1:
    fact: "The PX-900 plasma etcher requires chamber seal replacement every 1,200 RF hours."
    document: px900-maintenance-manual.md
  AF-2:
    fact: "Error code E-417 indicates a helium backside cooling leak and requires immediate chamber vent."
    document: px900-troubleshooting-guide.md
  AF-3:
    fact: "The recommended idle standby temperature for the LT-200 load lock is 45 degrees Celsius."
    document: lt200-operations-manual.md
  AF-4:
    fact: "Field service response time for Tier 1 contracts is 4 business hours."
    document: service-contracts-faq.md
  AF-5:
    fact: 'Part `PX900-SEAL-A2` exists in the spare parts catalog with description "chamber seal kit, fluoroelastomer".'
    document: spare-parts-catalog.md

  # Canned data for the pricing_lookup mock. Must agree with the catalog above.
  tool_fixtures:
    pricing_lookup:
      PX900-SEAL-A2:
        unit_price_usd: 1840.00
        volume_discount: { min_qty: 10, pct: 8 }
        lead_time_days: 21
      LT200-VALVE-B1:
        unit_price_usd: 412.50
        volume_discount: { min_qty: 25, pct: 5 }
        lead_time_days: 10

