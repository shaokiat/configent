# Sentinel facts — the single source of truth referenced by CONTEXT.md.
#
# Generated corpora are nondeterministic, so a small set of facts is planted verbatim
# in each client's corpus. Retrieval, citation, and eval tests assert against these,
# which gives them stable ground truth.
#
# Rules:
#   1. The sentence must appear in the named document character-for-character.
#   2. A sentinel must never appear in another client's corpus — the cross-client
#      isolation tests depend on it.

gcp-platform-support:
  # Knowledge base is public Google Cloud documentation (CC BY 4.0), curated into
  # corpora/gcp-platform-support/. Sentinels are sentences reproduced verbatim from those
  # pages, so ground truth is checkable against the upstream source as well as the corpus.
  # All five verified verbatim against the corpus on 2026-08-30.
  GCP-1:
    fact: "By default, each instance is limited to 1 vCPU."
    document: cloud-run-cpu-and-memory.md
    source: https://cloud.google.com/run/docs/configuring/services/cpu
  GCP-2:
    fact: "By default, metrics-based scaling sets a 60% threshold for CPU utilization and request concurrency targets."
    document: cloud-run-autoscaling.md
    source: https://cloud.google.com/run/docs/about-instance-autoscaling
  GCP-3:
    fact: "Container failed to start. Failed to start and then listen on the port defined by the PORT environment variable."
    document: cloud-run-troubleshooting.md
    source: https://cloud.google.com/run/docs/troubleshooting
  GCP-4:
    fact: "the cluster autoscaler never automatically scales down a cluster to zero nodes."
    document: gke-cluster-autoscaler.md
    source: https://cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler
  GCP-5:
    fact: "These roles can be useful for testing purposes, but shouldn't be used in production environments."
    document: iam-overview.md
    source: https://cloud.google.com/iam/docs/overview
