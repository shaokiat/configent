# GCP Platform Support (DeployBot): the documents-template client.
client_id: gcp-platform-support
name: "Cloud Platform Support"
branding:
  logo: assets/gcp-platform-support/logo.svg
  primary_color: "#1a73e8"
  assistant_name: "DeployBot"
  tagline: >-
    I answer Cloud Run, GKE and IAM questions from public Google Cloud documentation,
    with citations. When a question depends on your own project — quota, billing, IAM
    policy, cluster state — I can't answer it, so I open a ticket instead. Expand the
    step trail above any reply to see how that call was made.
  suggested_questions:
    # One per branch, in the order a demo should show them: answered from a single
    # document, answered by synthesising a list, then forced escalation.
    - "My Cloud Run container fails to start — what does the PORT error mean?"
    - "Why won't my GKE node pool scale down after I deleted the workload?"
    - "Can you raise my Cloud Run instance quota for europe-west1?"
corpus:
  source: corpora/gcp-platform-support/
  # Change anything here and the next ingest rebuilds the whole index; until it runs,
  # chat refuses to answer from the stale one.
  embedding:
    model: voyage-3
  chunking:
    chunk_size: 512
    overlap: 64
agent:
  # The documents template: RAG → corrective RAG → handoff (D10). Required: the
  # tag picks the template, and each template accepts only its own keys (D13).
  template: documents
  # The model must have a row in config/pricing/claude.yaml (D8).
  model: claude-haiku-4-5-20251001
  # answer.md; grade.md, rewrite.md and ticket_draft.md sit beside it.
  system_prompt_file: prompts/gcp-platform-support/answer.md
  max_tokens: 2048
  # Retrieval below this similarity is discarded before the model sees it.
  retrieval_drop_floor: 0.3
  # Level 1: the best surviving hit being weaker than this fails the tier (D2).
  escalate_below: 0.45
  # Both levels: the grader's groundedness confidence, below which the tier fails.
  confidence_threshold: 0.6
  # Level 2. Turn it off and a turn Level 1 cannot answer goes straight to a human.
  corrective:
    enabled: true
    query_rewrites: 3
# What happens when a turn can't be answered (D9). `mode: message` (the default) replies
# with fixed text instead; this client drafts a ticket and files it on confirmation.
handoff:
  mode: ticket
  categories:
    account_config: project configuration
    quota_or_billing: quota or billing
    incident: suspected incident
    access_request: access request
    docs_gap: documentation gap
    other: other
  product_areas: [cloud_run, gke, iam, other]
  preamble: >-
    That one needs a human: it depends on your own project configuration, and my
    knowledge base is public Google Cloud documentation only.
# Optional; these are the defaults. Query-side, so editing needs no re-ingest (D12).
# retrieval:
#   top_k: 5
#   rrf_k: 60
#   keyword:
#     enabled: true
evals:
  golden_set: evals/gcp-platform-support/golden.jsonl
  judge_model: claude-sonnet-4-6
limits:
  rate_limit_per_minute: 60
  daily_budget_usd: 2.00
